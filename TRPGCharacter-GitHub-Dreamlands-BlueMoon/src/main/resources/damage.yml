    damage: "1d6"
    armor: true

  VINDICATOR:
    name: "ヴィンディケーターの斧"
    damage: "1d8"
    armor: true

  RAVAGER:
    name: "ラヴェジャーの突進"
    damage: "2d6"
    armor: true

  BLAZE:
    name: "ブレイズの火球"
    damage: "1d6"
    armor: true

  GHAST:
    name: "ガストの火球"
    damage: "2d6"
    armor: true

  WITHER_SKELETON:
    name: "ウィザースケルトンの攻撃"
    damage: "1d6"
    armor: true

  WARDEN:
    name: "ウォーデンの攻撃"
    damage: "3d6"
    armor: true

  PLAYER:
    name: "プレイヤーの攻撃"
    damage: "1d3"
    armor: true

environment:
  FALL:
    name: "落下"
    armor: false

    # CoC6系の落下処理
    # 3ブロックまでは無傷。それを超えると約3ブロックごとに1d6。
    # 跳躍成功でダメージダイスを1個減らす。
    safe-blocks: 3.0
    blocks-per-die: 3.0
    max-dice: 8
    jump-skill: "jump"
    jump-success-reduce-dice: 1

  FIRE:
    name: "炎"
    damage: "1"
    armor: false
    cooldown-seconds: 3

  FIRE_TICK:
