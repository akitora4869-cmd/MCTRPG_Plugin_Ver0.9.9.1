# damage        : 命中時のダメージダイス
# armor         : プレイヤーから攻撃された時の固定装甲
# player-armor  : Mobの攻撃に探索者側の装甲を適用するか
#
# 未登録Mobは従来のMinecraft挙動 / damage.yml の処理を使用します。

