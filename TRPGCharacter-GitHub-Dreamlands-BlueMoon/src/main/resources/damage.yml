# TRPG式ダメージ設定
#
# damage は以下の形式に対応します。
#   1
#   1d3
#   1d6+2
#   2d6
#
# mobs:
#   EntityType名で指定します。
#
# environment:
#   EntityDamageEvent.DamageCause名で指定します。
#
# 値を変更後はサーバーを再起動するか /status reload を実行してください。

enabled: true

# Minecraft標準の満腹度による自然回復を無効化
disable-natural-regeneration: true

# 短時間に連続発生する接触系ダメージは完全に0にする。
# CONTACT: スイートベリー・サボテンなど
# HOT_FLOOR: マグマブロック
zero-damage-causes:
  - CONTACT
  - HOT_FLOOR

# mobs に登録されていない攻撃者の標準値
default:
  name: "攻撃"
  damage: "1d3"

mobs:
  ZOMBIE:
    name: "ゾンビのこぶし"
    damage: "1d3"
    armor: true

  HUSK:
    name: "ハスクのこぶし"
    damage: "1d3"
    armor: true

  DROWNED:
    name: "ドラウンドの打撃"
    damage: "1d4"
    armor: true

  SKELETON:
    name: "スケルトンの弓"
    damage: "1d4"
    armor: true

  STRAY:
    name: "ストレイの弓"
    damage: "1d4"
    armor: true

  SPIDER:
    name: "クモの噛みつき"
    damage: "1d3"
    armor: true

  CAVE_SPIDER:
    name: "洞窟グモの噛みつき"
    damage: "1d3"
    armor: true

  CREEPER:
    name: "クリーパーの爆発"
    damage: "2d6"
    armor: true

  ENDERMAN:
    name: "エンダーマンの打撃"
    damage: "1d6"
    armor: true

  WITCH:
    name: "ウィッチの攻撃"
